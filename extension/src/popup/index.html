<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Browser Controls Agent</title>
    <style>
      body {
        min-width: 300px;
        font-family: system-ui, -apple-system, sans-serif;
        padding: 16px;
        margin: 0;
      }
      .field {
        margin-bottom: 12px;
      }
      label {
        display: block;
        font-size: 12px;
        margin-bottom: 4px;
        color: #666;
      }
      input[type="text"] {
        width: 100%;
        box-sizing: border-box;
        padding: 6px 8px;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 14px;
      }
      button {
        padding: 6px 12px;
        border: none;
        border-radius: 4px;
        font-size: 13px;
        cursor: pointer;
      }
      #save {
        background: #4CAF50;
        color: white;
        width: 100%;
      }
      #save:hover {
        background: #45a049;
      }
      .inspect-buttons {
        display: flex;
        gap: 8px;
        margin-top: 8px;
      }
      #inspect-start {
        flex: 1;
        background: #2196F3;
        color: white;
      }
      #inspect-start:hover {
        background: #1976D2;
      }
      #inspect-start.active {
        background: #0D47A1;
        box-shadow: inset 0 0 0 2px #90CAF9;
      }
      #inspect-stop {
        flex: 1;
        background: #f44336;
        color: white;
      }
      #inspect-stop:hover {
        background: #d32f2f;
      }
      .inspect-status {
        margin-top: 6px;
        font-size: 12px;
        text-align: center;
        min-height: 16px;
      }
      .inspect-status.inspecting {
        color: #0D47A1;
        font-weight: 600;
      }
      .inspect-status.error {
        color: #d32f2f;
      }
      .inspect-status.idle {
        color: #666;
      }
      #status {
        margin-top: 12px;
        padding: 8px;
        font-size: 12px;
        color: #666;
        text-align: center;
      }
      .connection-status {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 12px;
        padding: 8px;
        border-radius: 4px;
        font-size: 13px;
        background: #f5f5f5;
      }
      .status-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        flex-shrink: 0;
      }
      .status-dot.connected {
        background: #4CAF50;
        box-shadow: 0 0 4px #4CAF50;
      }
      .status-dot.disconnected {
        background: #f44336;
      }
    </style>
  </head>
  <body>
    <main id="app">
      <div class="connection-status">
        <span id="status-dot" class="status-dot disconnected"></span>
        <span id="status-text">Disconnected</span>
      </div>
      <div class="field">
        <label for="ws-url">WebSocket URL</label>
        <input id="ws-url" type="text" placeholder="ws://localhost:8765" />
      </div>
      <div class="field">
        <label for="token">Token (optional)</label>
        <input id="token" type="text" placeholder="Authentication token" />
      </div>
      <button id="save">Save Configuration</button>
      <div class="inspect-buttons">
        <button id="inspect-start">Start Inspect</button>
        <button id="inspect-stop">Stop Inspect</button>
      </div>
      <div id="inspect-status" class="inspect-status"></div>
      <div id="status"></div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
